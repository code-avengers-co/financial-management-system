spring.application.name=financialmanagement

# Active Spring profile: dev or prod
spring.profiles.active=dev

# Keep JPA from accessing the database while Thymeleaf renders the view
spring.jpa.open-in-view=false

# Fixed Brazilian Portuguese locale
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Global date format
spring.mvc.format.date=dd/MM/yyyy
spring.mvc.format.date-time=dd/MM/yyyy HH:mm
