spring.application.name=financialmanagement

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:financialdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=12345

# H2 console in the browser (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Print the generated SQL in the terminal
spring.jpa.show-sql=true

# Hibernate creates/updates the tables for now; replace with Flyway migrations later
spring.jpa.hibernate.ddl-auto=update
