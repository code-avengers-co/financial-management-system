<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>Painel</title>
</head>

<body>
<!-- conteudo principal -->
<main layout:fragment="conteudo" th:fragment="conteudo" id="main" class="flex flex-col align-middle w-full">

    <h3 class="text-xl md:text-3xl mt-10 ms-16">Painel</h3>
    <p th:text="${period}" class="mt-2 ms-16 text-gray-500">Novembro de 2026</p>

    <!-- Resumo do mes -->
    <div class="grid md:grid-cols-4 gap-4 md:w-5/6 ms-16 mt-8">
        <div class="border rounded-xl shadow bg-white p-6">
            <p class="text-sm text-gray-500">Receitas do mês</p>
            <p th:text="${#numbers.formatCurrency(summary.totalIncome)}" class="mt-2 text-2xl font-semibold text-green-700">R$ 0,00</p>
        </div>
        <div class="border rounded-xl shadow bg-white p-6">
            <p class="text-sm text-gray-500">Despesas do mês</p>
            <p th:text="${#numbers.formatCurrency(summary.totalExpense)}" class="mt-2 text-2xl font-semibold text-red-700">R$ 0,00</p>
        </div>
        <div class="border rounded-xl shadow bg-white p-6">
            <p class="text-sm text-gray-500">Resultado do mês</p>
            <p th:text="${#numbers.formatCurrency(summary.balance)}"
               th:classappend="${summary.balance.signum() < 0} ? 'text-red-700' : 'text-green-700'"
               class="mt-2 text-2xl font-semibold">R$ 0,00</p>
        </div>
        <div class="border rounded-xl shadow bg-white p-6">
            <p class="text-sm text-gray-500">Saldo das contas</p>
            <p th:text="${#numbers.formatCurrency(totalBalance)}"
               th:classappend="${totalBalance.signum() < 0} ? 'text-red-700' : 'text-gray-800'"
               class="mt-2 text-2xl font-semibold">R$ 0,00</p>
        </div>
    </div>

    <!-- Contas -->
    <h4 class="text-lg md:text-xl mt-10 ms-16">Contas</h4>
    <div class="flex flex-col md:w-2/3 ms-16 mt-4">
        <div class="overflow-x-auto">
            <div class="min-w-full inline-block align-middle">
                <div class="border rounded-xl overflow-hidden shadow">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                        <tr>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Nome</th>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Saldo atual</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="account : ${accounts}" class="odd:bg-white even:bg-gray-100 hover:bg-gray-200">
                            <td th:text="${account.name}" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">Carteira</td>
                            <td th:text="${#numbers.formatCurrency(account.currentBalance)}"
                                th:classappend="${account.currentBalance.signum() < 0} ? 'text-red-700' : 'text-gray-800'"
                                class="px-6 py-4 whitespace-nowrap text-sm font-medium">R$ 0,00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-500">Nenhuma conta cadastrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- !conteudo principal -->
</body>

</html>
