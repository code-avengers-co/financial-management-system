<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>Pesquisa de Lançamentos</title>
</head>

<body>
<!-- conteudo principal -->
<main layout:fragment="conteudo" th:fragment="conteudo" id="main" class="flex flex-col align-middle w-full">

    <h3 class="text-xl md:text-3xl mt-10 ms-16">Pesquisa de Lançamentos</h3>

    <h3 th:if="${not #strings.isEmpty(message)}" th:text="${message}"
        class="text-2xl md:text-4xl text-center mt-6">Mensagem</h3>

    <!-- Formulario de pesquisa -->
    <form th:hx-get="@{/transactions}" th:object="${transactionSearchRequest}" class="md:w-2/3 mt-6 ms-16">
        <div class="grid md:grid-cols-3 gap-x-4">
            <div th:replace="~{components/forms :: selectNormal(textoLabel='Mês', nomeAtributo='month',
                 listaOpcoes=${months}, propValue='number', propLabel='name',
                 valorAtributo=${transactionSearchRequest.month})}"></div>
            <div th:replace="~{components/forms :: inputNumero(textoLabel='Ano', nomeAtributo='year',
                 valorAtributo=${transactionSearchRequest.year}, isDecimal=false, showGroups=false)}"></div>
            <div th:replace="~{components/forms :: selectNormal(textoLabel='Conta', nomeAtributo='accountId',
                 listaOpcoes=${accounts}, propValue='id', propLabel='name', textoPlaceholder='Todas',
                 valorAtributo=${transactionSearchRequest.accountId})}"></div>
        </div>

        <button type="submit"
                class="mt-8 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200">
            Pesquisar
        </button>
    </form>

    <!-- Tabela -->
    <div class="flex flex-col md:w-5/6 ms-16 mt-10">
        <div class="overflow-x-auto">
            <div class="min-w-full inline-block align-middle">
                <div class="border rounded-xl overflow-hidden shadow">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                        <tr>
                            <th:block th:replace="~{components/paginacao :: coluna(${page}, 'transactionDate', 'Data', '')}"></th:block>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Descrição</th>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Conta</th>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Categoria</th>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Tipo</th>
                            <th:block th:replace="~{components/paginacao :: coluna(${page}, 'amount', 'Valor', '')}"></th:block>
                            <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="transaction : ${page.conteudo}" class="odd:bg-white even:bg-gray-100 hover:bg-gray-200">
                            <td th:text="${#temporals.format(transaction.transactionDate, 'dd/MM/yyyy')}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">01/11/2026</td>
                            <td th:text="${transaction.description}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">Mercado</td>
                            <td th:text="${transaction.accountName}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">Carteira</td>
                            <td th:text="${transaction.categoryName}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">Alimentação</td>
                            <td th:text="${transaction.type.description}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">Despesa</td>
                            <td th:text="${#numbers.formatCurrency(transaction.amount)}"
                                th:classappend="${transaction.type.name() == 'INCOME'} ? 'text-green-700' : 'text-red-700'"
                                class="px-6 py-4 whitespace-nowrap text-sm font-medium">R$ 0,00</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center gap-6">
                                    <a th:hx-get="@{/transactions/{id}/edit(id=${transaction.id})}"
                                       class="cursor-pointer py-2 px-3 text-sm font-medium rounded-lg bg-blue-100 text-blue-800 hover:bg-blue-200">
                                        Alterar
                                    </a>

                                    <button type="button"
                                            th:hx-delete="@{/transactions/{id}(id=${transaction.id})}"
                                            hx-confirm="Tem certeza que deseja remover este lançamento?"
                                            class="py-2 px-3 text-sm font-medium rounded-lg bg-red-100 text-red-800 hover:bg-red-200">
                                        Remover
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${page.vazia}">
                            <td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">Nenhum lançamento encontrado</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Paginacao -->
    <div th:replace="~{components/paginacao :: paginacao(${page})}"></div>
</main>
<!-- !conteudo principal -->
</body>

</html>
