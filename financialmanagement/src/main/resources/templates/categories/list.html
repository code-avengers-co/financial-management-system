<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>Pesquisa de Categorias</title>
</head>

<body>
<!-- conteudo principal -->
<main layout:fragment="conteudo" th:fragment="conteudo" id="main" class="flex flex-col align-middle w-full">

    <h3 class="text-xl md:text-3xl mt-10 ms-16">Pesquisa de Categorias</h3>

    <h3 th:if="${not #strings.isEmpty(message)}" th:text="${message}"
        class="text-2xl md:text-4xl text-center mt-6">Mensagem</h3>

    <!-- Formulario de pesquisa -->
    <form th:hx-get="@{/categories}" th:object="${categorySearchRequest}" class="w-1/2 mt-6 ms-16">
        <div th:replace="~{components/forms :: inputNumero(textoLabel='Código', nomeAtributo='id',
             valorAtributo=${categorySearchRequest.id}, isDecimal=false, showGroups=false)}"></div>
        <div th:replace="~{components/forms :: inputTexto(textoLabel='Nome', nomeAtributo='name',
             valorAtributo=${categorySearchRequest.name})}"></div>

        <button type="submit"
                class="mt-8 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200">
            Pesquisar
        </button>
    </form>

    <!-- Tabela -->
    <div class="flex flex-col md:w-2/3 ms-16 mt-10">
        <div class="overflow-x-auto">
            <div class="min-w-full inline-block align-middle">
                <div class="border rounded-xl overflow-hidden shadow">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                        <tr>
                            <th:block th:replace="~{components/paginacao :: coluna(${page}, 'id', 'Código', '')}"></th:block>
                            <th:block th:replace="~{components/paginacao :: coluna(${page}, 'name', 'Nome', '')}"></th:block>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="category : ${page.conteudo}" class="odd:bg-white even:bg-gray-100 hover:bg-gray-200">
                            <td th:text="${category.id}" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">1</td>
                            <td th:text="${category.name}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">Alimentação</td>
                        </tr>
                        <tr th:if="${page.vazia}">
                            <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-500">Nenhuma categoria encontrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Paginacao -->
    <div th:replace="~{components/paginacao :: paginacao(${page})}"></div>
</main>
<!-- !conteudo principal -->
</body>

</html>
