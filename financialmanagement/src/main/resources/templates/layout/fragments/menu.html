<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">


<div data-th-fragment="menu" class="space-y-4" th:fragment="menu" id="menu">

  <!-- 1o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Conta', ~{::#conta-icon})}"></button>

    <!-- Opcoes do 1o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/accounts/new', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/accounts', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 2o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Lançamento', ~{::#lancamento-icon})}"></button>

    <!-- Opcoes do 2o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/transactions/new', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/transactions', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 3o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Orçamento', ~{::#orcamento-icon})}"></button>

    <!-- Opcoes do 3o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/budgets/new', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/budgets', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 4o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Categoria', ~{::#categoria-icon})}"></button>

    <!-- Opcoes do 4o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/categories/new', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/categories', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>
</div>
