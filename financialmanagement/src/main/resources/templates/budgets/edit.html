<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>Alterar Orçamento</title>
</head>

<body>

<main layout:fragment="conteudo"
      th:fragment="formulario"
      id="main"
      class="flex flex-col align-middle w-full">

    <h3 class="text-xl md:text-3xl mt-10 ms-16">
        Alterar Orçamento
    </h3>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"
       class="text-red-500 mt-4 ms-16">
    </p>

    <form th:hx-put="@{/budgets/{id}(id=${budgetId})}"
          th:object="${budgetUpdateRequest}"
          class="w-1/2 mt-10 ms-16">

        <div th:replace="~{budgets/fragments/budget_inputs :: campos}"></div>

        <button type="submit"
                class="mt-8 px-6 py-3 bg-gray-800 text-white rounded-lg hover:bg-gray-700">
            Salvar alterações
        </button>

    </form>

</main>

</body>
</html>
